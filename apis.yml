aid: oratomic
name: Oratomic
description: 'Oratomic is a Pasadena, California quantum computing company where leading researchers
  from Caltech and Harvard are building utility-scale, fault-tolerant quantum computers with neutral
  atoms and optical systems. Launched from stealth in March 2026, the company advances quantum error
  correction with the aim of making practical, cryptographically relevant quantum computation possible
  with far fewer qubits than previously believed (on the order of ~10,000 reconfigurable atomic qubits
  rather than millions). Oratomic is a deep-tech hardware and research organization; at this time it
  publishes no public API, developer portal, SDK, or programmatic access surface.'
